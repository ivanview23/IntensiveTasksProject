server:
  port: 8761

spring:
  application:
    name: service-discovery
  cloud:
    config:
      enabled: false

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false   # Eureka сервер не регистрирует себя
    fetch-registry: false         # Не получает реестр других инстансов
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    enable-self-preservation: false  # Отключаем self-preservation для dev
    eviction-interval-timer-in-ms: 5000  # Частота очистки мертвых инстансов

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO
    org.example.discovery: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"