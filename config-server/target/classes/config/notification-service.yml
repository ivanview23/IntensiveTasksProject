# Конфигурация только для notification-service
server:
  port: 8082

spring:
  application:
    name: notification-service

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${NOTIFICATION_EMAIL:test@gmail.com}
    password: ${NOTIFICATION_PASSWORD:password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# Email настройки
notification:
  email:
    from: noreply@myapp.com
    subject:
      user-created: "Добро пожаловать!"
      user-deleted: "Ваш аккаунт удален"
    templates:
      welcome: "Привет, %s! Добро пожаловать в наше приложение."
      goodbye: "Ваш аккаунт был успешно удален."

  retry:
    max-attempts: 3
    delay-ms: 1000

logging:
  level:
    org.example.notification: DEBUG
    org.springframework.kafka: INFO
    org.springframework.mail: DEBUG