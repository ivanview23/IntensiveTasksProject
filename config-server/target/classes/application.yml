server:
  port: 8888

spring:
  application:
    name: config-server

  # Используем файловую систему для хранения конфигураций
  # В продакшене лучше использовать Git
  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

  # Security (отключим для простоты)
  security:
    user:
      name: admin
      password: configpass

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,configprops
  endpoint:
    health:
      show-details: always

# Логирование
logging:
  level:
    org.springframework.cloud.config: DEBUG
    org.example.config: DEBUG